# Production overlay for the VPS, which is fronted by a Cloudflare Tunnel
# (cloudflared runs there with --network host, token/dashboard-managed).
#
# Model: five public hostnames, exactly like every other app on the box —
#   cosimo.homannjohannes.de      -> CMS      (admin + API only)
#   ws-cosimo.homannjohannes.de   -> realtime (the WebSocket)
#   console-cosimo.homannjohannes.de -> host console (the operator's control surface)
#   seat-cosimo.homannjohannes.de -> seat emulator (a browser iPad)
#   journey-cosimo.homannjohannes.de -> journey view (the line, live)
# Cloudflare terminates TLS at the edge. cms and realtime are published on
# localhost only (bound to 127.0.0.1), where the host's cloudflared reaches
# them — nothing is exposed to the public internet directly.
#
# Run:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file .env.prod up -d --build
#
# Then add FIVE public hostnames in the Cloudflare dashboard (Zero Trust ->
# Networks -> Tunnels -> your tunnel -> Public Hostnames), same as your other
# services:
#   cosimo.homannjohannes.de      -> http://localhost:${COSIMO_CMS_PORT:-6220}
#   ws-cosimo.homannjohannes.de   -> http://localhost:${COSIMO_RT_PORT:-6221}
#   console-cosimo.homannjohannes.de -> http://localhost:${COSIMO_CONSOLE_PORT:-6222}
#   seat-cosimo.homannjohannes.de -> http://localhost:${COSIMO_EMU_PORT:-6223}
#   journey-cosimo.homannjohannes.de -> http://localhost:${COSIMO_JOURNEY_PORT:-6224}
# Make sure the tunnel has WebSockets enabled (default on) for the ws- host.

services:
  postgres:
    ports: !override []

  cms:
    build:
      # NEXT_PUBLIC_* must be inlined at build time (see apps/cms/Dockerfile).
      args:
        NEXT_PUBLIC_SERVER_URL: https://${COSIMO_DOMAIN:?set COSIMO_DOMAIN in .env.prod}
    # `--env-file .env.prod` only feeds compose interpolation; the CONTAINER
    # gets its secrets from env_file. The base file names .env.local (dev),
    # which does not exist on the VPS — so here the prod file is the one.
    env_file:
      - path: .env.prod
        required: true
    ports: !override
      - "127.0.0.1:${COSIMO_CMS_PORT:-6220}:6100"
    environment:
      NEXT_PUBLIC_SERVER_URL: https://${COSIMO_DOMAIN}

  realtime:
    env_file:
      - path: .env.prod
        required: true
    ports: !override
      - "127.0.0.1:${COSIMO_RT_PORT:-6221}:6101"
    environment:
      # Origins that open sockets to realtime: the native kiosk WebView, the
      # host console and the seat emulator. The CMS opens no sockets; ws- is
      # the target, not an origin, so it is not listed here.
      CORS_ORIGINS: https://${COSIMO_CONSOLE_DOMAIN:-console-${COSIMO_DOMAIN}},https://${COSIMO_SEAT_DOMAIN:-seat-${COSIMO_DOMAIN}},https://${COSIMO_JOURNEY_DOMAIN:-journey-${COSIMO_DOMAIN}},capacitor://localhost

  # Both static bundles bake the ws- host at build time.
  console:
    build:
      args:
        VITE_REALTIME_URL: https://${COSIMO_WS_DOMAIN:?set COSIMO_WS_DOMAIN in .env.prod}
    ports: !override
      - "127.0.0.1:${COSIMO_CONSOLE_PORT:-6222}:80"

  emulator:
    build:
      args:
        VITE_REALTIME_URL: https://${COSIMO_WS_DOMAIN}
    ports: !override
      - "127.0.0.1:${COSIMO_EMU_PORT:-6223}:80"

  journey:
    build:
      args:
        VITE_REALTIME_URL: https://${COSIMO_WS_DOMAIN}
    ports: !override
      - "127.0.0.1:${COSIMO_JOURNEY_PORT:-6224}:80"

  # Nightly pg_dump into ./backups (sessions are the research dataset —
  # copy this directory off the box regularly).
  pg-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-cosimo}
      PGPASSWORD: ${POSTGRES_PASSWORD:-cosimo_dev}
      PGDATABASE: ${POSTGRES_DB:-cosimo}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          ts=$$(date +%Y-%m-%d_%H-%M)
          pg_dump -Fc -f "/backups/cosimo_$$ts.dump" && echo "[pg-backup] wrote cosimo_$$ts.dump"
          find /backups -name 'cosimo_*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep 86400
        done
