# CoSiMo's own brain on the GX10 — a dedicated vLLM serving the STOCK Qwen3
# 27B (NVFP4), separate from any other project's container on the box.
#
# Network: the box's host Tailscale belongs to another user's tailnet, so this
# stack brings ITS OWN tailnet membership — a `tailscale` sidecar (joined to
# CoSiMo's tailnet with a tagged auth key) owns a network namespace and
# `cosimo-llm` runs inside it. The model is reachable at the sidecar's tailnet
# IP on port 8007 and nowhere else: no host port, nothing on the university
# LAN. No sudo needed (docker group grants /dev/net/tun + NET_ADMIN).
#
# Deploy on the GX10:
#   mkdir -p ~/cosimo-ai && scp infra/gx10/* GX10:~/cosimo-ai/ && ssh GX10 \
#     'cd ~/cosimo-ai && cp -n .env.example .env && docker compose up -d'
# .env needs VLLM_API_KEY (what CoSiMo's realtime sends) and TS_AUTHKEY (a
# tagged tag:cosimo-gx10 key from CoSiMo's tailnet).

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: cosimo-tailscale
    hostname: ${TS_HOSTNAME:-cosimo-gx10}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY (tagged tag:cosimo-gx10) in .env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "false"
      TS_EXTRA_ARGS: --advertise-tags=${TS_TAG:-tag:cosimo-gx10}
    volumes:
      - cosimo_tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    # Healthy = on the tailnet. (The model's own health is its own check.)
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --peers=false >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  cosimo-llm:
    image: ghcr.io/aeon-7/aeon-vllm-ultimate:2026-08-16-v0.27.1
    container_name: cosimo-llm
    restart: unless-stopped
    # Lives in the sidecar's namespace: reachable on the tailnet IP only.
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    # The image's entrypoint is a shell; the CLI is `vllm` (serve …).
    entrypoint: ["vllm"]
    ipc: host
    shm_size: "1g"
    environment:
      VLLM_API_KEY: ${VLLM_API_KEY:?set VLLM_API_KEY in .env}
      HF_HOME: /root/.cache/huggingface
      TOKENIZERS_PARALLELISM: "false"
      TORCH_CUDA_ARCH_LIST: 12.1a
      VLLM_USE_FLASHINFER_SAMPLER: "1"
    volumes:
      - cosimo_llm_hf_cache:/root/.cache/huggingface
      - cosimo_llm_kernel_cache:/root/.cache/vllm
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    # CoSiMo turns are short: a 32k window keeps the KV cache small and the
    # first token fast. Four seats → max-num-seqs 4. Thinking off — "turn the
    # light on" gains nothing from it and pays double first-token latency.
    command:
      - serve
      - ${MODEL:-unsloth/Qwen3.8-27B-NVFP4}
      - --served-model-name
      - cosimo-qwen3-27b
      - --gpu-memory-utilization
      - ${GPU_MEM:-0.24}
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "4"
      - --max-num-batched-tokens
      - "8192"
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
      - --generation-config
      - vllm
      - --host
      - 0.0.0.0
      - --port
      - "8007"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8007/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 900s
      retries: 5

volumes:
  cosimo_tailscale_state:
  cosimo_llm_hf_cache:
  cosimo_llm_kernel_cache:
