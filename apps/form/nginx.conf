# The questionnaire: a static bundle plus exactly two proxied paths to the
# CMS container, so the browser sees one origin and the CMS needs no CORS
# entry. Everything else under /api/ is 404 — the CMS stays reachable only
# through its own host.
#
# Behind the Cloudflare Tunnel every request arrives from cloudflared, so
# the rate limit keys on CF-Connecting-IP (falling back to the socket
# address). Generous on purpose: a venue Wi-Fi puts many visitors behind one
# address, and a throttled real visitor is silent data loss.
map $http_cf_connecting_ip $form_client_ip {
    default $binary_remote_addr;
    "~."    $http_cf_connecting_ip;
}
limit_req_zone $form_client_ip zone=form:1m rate=30r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the cms container at request time — a literal proxy_pass caches
    # the IP at start and 502s forever after the container is restarted
    # (the console has a restart button for it).
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $cms http://cms:6100;

    location / {
        try_files $uri /index.html;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The start token (the honest timer) — GET only.
    location = /api/survey-start {
        limit_except GET { deny all; }
        limit_req zone=form burst=40 nodelay;
        access_log off;
        proxy_pass $cms;
        proxy_set_header X-Forwarded-Proto https;
    }
    # The submission — POST only, small body, no access log (no IPs on disk:
    # the privacy notice promises that).
    location = /api/survey-responses {
        limit_except POST { deny all; }
        limit_req zone=form burst=40 nodelay;
        access_log off;
        client_max_body_size 8k;
        proxy_pass $cms;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ {
        return 404;
    }
}
