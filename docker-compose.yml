name: cosimo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cosimo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cosimo_dev}
      POSTGRES_DB: ${POSTGRES_DB:-cosimo}
    ports:
      - "5432:5432"
    volumes:
      # Named volume (not a host bind-mount) — avoids macOS file-lock issues.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cosimo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URI: ${DATABASE_URI:-postgres://cosimo:cosimo_dev@postgres:5432/cosimo}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-dev-secret}
      PAYLOAD_INTERNAL_KEY: ${PAYLOAD_INTERNAL_KEY:-change-me-internal}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3001}
      NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-http://localhost:4000}
    ports:
      - "${CMS_PORT:-3001}:3001"

  realtime:
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REALTIME_PORT: 4000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      PAYLOAD_INTERNAL_URL: ${PAYLOAD_INTERNAL_URL:-http://cms:3001}
      PAYLOAD_API_KEY: ${PAYLOAD_API_KEY:-}
      PAYLOAD_INTERNAL_KEY: ${PAYLOAD_INTERNAL_KEY:-change-me-internal}
      CORS_ORIGINS: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3001}
      LIGHT_DRIVER: ${LIGHT_DRIVER:-fake}
      SHELLY_BASE_URL: ${SHELLY_BASE_URL:-}
    ports:
      - "${REALTIME_PORT:-4000}:4000"

volumes:
  pgdata:
