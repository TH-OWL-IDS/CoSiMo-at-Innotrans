name: cosimo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Zombie "idle in transaction" connections (e.g. Payload transactions
    # leaked by aborted requests) once starved the CMS pool and hung its API —
    # kill them after 2 min instead of letting them wedge the stack.
    command: postgres -c idle_in_transaction_session_timeout=120000
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cosimo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cosimo_dev}
      POSTGRES_DB: ${POSTGRES_DB:-cosimo}
    ports:
      - "5432:5432"
    volumes:
      # Named volume (not a host bind-mount) — avoids macOS file-lock issues.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cosimo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Load secrets/keys from the gitignored .env.local (if present); the
    # `environment:` overrides below win for the Docker-specific networking URLs.
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URI: ${DATABASE_URI:-postgres://cosimo:cosimo_dev@postgres:5432/cosimo}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-dev-secret}
      PAYLOAD_INTERNAL_KEY: ${PAYLOAD_INTERNAL_KEY:-change-me-internal}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:6100}
    ports:
      - "${CMS_PORT:-6100}:6100"

  realtime:
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Keys (ANTHROPIC, ELEVENLABS, DEEPGRAM, HEALTH…) come from
    # .env.local; the `environment:` overrides win for the container URLs.
    env_file:
      - path: .env.local
        required: false
    environment:
      REALTIME_PORT: 6101
      PAYLOAD_INTERNAL_URL: ${PAYLOAD_INTERNAL_URL:-http://cms:6100}
      # Where the hub probes the static sites for the console's Services card
      # (nginx on :80 inside the network). No emulator service in this file.
      SERVICE_URL_CONSOLE: http://console
      SERVICE_URL_JOURNEY: http://journey
      SERVICE_URL_FORM: http://form
      PAYLOAD_INTERNAL_KEY: ${PAYLOAD_INTERNAL_KEY:-change-me-internal}
      CORS_ORIGINS: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:6100},http://localhost:6102,http://localhost:6103,http://localhost:6104,capacitor://localhost
    ports:
      - "${REALTIME_PORT:-6101}:6101"
    # The structured debug log (daily NDJSON) — survives container rebuilds.
    volumes:
      - ./logs:/app/apps/realtime/logs

  # Host console — the live operator console (static bundle). On the VPS it
  # is the control surface during the show. Locally the dev server is faster.
  console:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
      args:
        VITE_REALTIME_URL: ${REALTIME_PUBLIC_URL:-http://localhost:6101}
    restart: unless-stopped
    ports:
      - "${CONSOLE_PORT:-6102}:80"

  # Journey view — the line as a horizontal diagram, the cab moving along it
  # (static bundle). For a booth screen, and for watching the simulation.
  journey:
    build:
      context: .
      dockerfile: apps/journey/Dockerfile
      args:
        VITE_REALTIME_URL: ${REALTIME_PUBLIC_URL:-http://localhost:6101}
    restart: unless-stopped
    ports:
      - "${JOURNEY_PORT:-6104}:80"

  # Visitor questionnaire — a static bundle whose nginx proxies two API paths
  # to the cms container (same-origin for the browser, no CORS). See docs/form.md.
  form:
    build:
      context: .
      dockerfile: apps/form/Dockerfile
    restart: unless-stopped
    ports:
      - "${FORM_PORT:-6105}:80"

  # Seat emulator — a browser stand-in for one iPad (static bundle). Optional.
  emulator:
    build:
      context: .
      dockerfile: apps/emulator/Dockerfile
      args:
        VITE_REALTIME_URL: ${REALTIME_PUBLIC_URL:-http://localhost:6101}
    restart: unless-stopped
    ports:
      - "${EMULATOR_PORT:-6103}:80"

volumes:
  pgdata:
